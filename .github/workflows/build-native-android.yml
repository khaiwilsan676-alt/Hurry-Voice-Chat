name: Build Native Hurry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native debug APK
        working-directory: android-native
        env:
          HURRY_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish versioned Native APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hurry-native-${{ github.run_number }}
          name: Hurry Native ${{ github.run_number }}
          body: Automatic Native APK update for commit ${{ github.sha }}
          make_latest: true
          files: android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish stable Native APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hurry-native-latest
          name: Hurry Native Latest
          body: Always points to the newest successful native Android build.
          prerelease: false
          make_latest: false
          files: android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hurry-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
