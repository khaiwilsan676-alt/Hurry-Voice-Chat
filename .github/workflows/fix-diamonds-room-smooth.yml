name: Fix diamonds and RoomPage smoothness
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()
          old = '''    const diamondAmount =\n      Number.isFinite(value) && value > 0\n        ? Math.floor(value * (isLucky ? 0.1 : 1))\n        : 0;'''
          new = '''    // Every received coin is credited 1:1 as Diamonds.\n    const diamondAmount =\n      Number.isFinite(value) && value > 0\n        ? Math.floor(value)\n        : 0;'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('backend diamond calculation pattern not found')
          p.write_text(s)

          p = Path('components/RoomPage.tsx')
          s = p.read_text()
          old = '''          ? Math.floor(rawDiamondAmount)\n          : Number.isFinite(rawCoinAmount) && rawCoinAmount > 0\n            ? Math.floor(rawCoinAmount * (isLucky ? 0.1 : 1))\n            : 0;'''
          new = '''          ? Math.floor(rawDiamondAmount)\n          : Number.isFinite(rawCoinAmount) && rawCoinAmount > 0\n            ? Math.floor(rawCoinAmount)\n            : 0;'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('RoomPage diamond fallback pattern not found')
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js components/RoomPage.tsx
          git diff --cached --quiet || git commit -m 'Fix 1:1 gift diamonds and RoomPage transfer handling'
          git push
