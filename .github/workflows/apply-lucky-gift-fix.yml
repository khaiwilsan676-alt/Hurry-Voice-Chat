name: Apply Lucky Gift Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[lucky-gift-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch GiftPicker
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/GiftPicker.tsx')
          s = p.read_text(encoding='utf-8')

          marker = '  const parseMultiplier = (m: string) => parseInt(m.replace("×", ""), 10) || 1;\n'
          helper = r'''  const parseMultiplier = (m: string) => parseInt(m.replace("×", ""), 10) || 1;

  // Lucky gifts are image-only room gifts. The existing room emoji transport
  // already broadcasts `gif` state to every seat, so we reuse it without
  // changing the normal gift/video flow.
  const createLuckyGiftAnimationSrc = (image: string) => {
    const safeImage = String(image || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><image href="${safeImage}" x="5" y="-35" width="90" height="90"><animate attributeName="x" values="5;45" dur="1.1s" fill="freeze"/><animate attributeName="y" values="-35;45" dur="1.1s" fill="freeze"/><animate attributeName="width" values="90;10" dur="1.1s" fill="freeze"/><animate attributeName="height" values="90;10" dur="1.1s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="1.1s" fill="freeze"/></image></svg>`;
    return `data:image/svg+xml;base64,${btoa(svg)}`;
  };
'''
          if marker not in s:
              raise SystemExit('GiftPicker parseMultiplier marker not found')
          if 'createLuckyGiftAnimationSrc' not in s:
              s = s.replace(marker, helper, 1)

          old = '''    if (roomId && currentUserAccountId && recipientIds.length > 0) {
      socket.emit("coin_transfer", {
        roomId: String(roomId),
        senderId: String(currentUserAccountId),
        recipientIds: recipientIds.map(String),
        amount: totalCost,
        giftName: selectedGiftObj.name,
      });
    }
'''
          new = '''    if (roomId && currentUserAccountId && recipientIds.length > 0) {
      const isLuckyGift = activeTab === "Lucky";
      const recipientIdSet = new Set(recipientIds.map(String));

      // Diamond reward rule: Lucky image gifts only = exactly 10% of the
      // per-recipient gift value. All other gifts keep their existing value.
      const receiverDiamondAmount = isLuckyGift
        ? Math.floor(totalCost * 0.10)
        : totalCost;

      socket.emit("coin_transfer", {
        roomId: String(roomId),
        senderId: String(currentUserAccountId),
        recipientIds: recipientIds.map(String),
        amount: receiverDiamondAmount,
        giftName: selectedGiftObj.name,
      });

      // Lucky image animation only: send it to the actual occupied seat of
      // every selected recipient. The server already synchronizes `gif` seat
      // state and clears it after 5 seconds.
      if (isLuckyGift) {
        const animationSrc = createLuckyGiftAnimationSrc(selectedGiftObj.image);
        const animationTimestamp = Date.now();

        for (const seat of seats) {
          const targetId = String(seat.user?.accountId || "");
          if (!seat.isOccupied || !targetId || !recipientIdSet.has(targetId)) continue;

          socket.emit("room_seat_action", {
            roomId: String(roomId),
            userId: String(currentUserAccountId),
            action: "emoji",
            seatNumber: Number(seat.number),
            src: animationSrc,
            timestamp: animationTimestamp,
            user: {
              name: "Lucky Gift",
              image: selectedGiftObj.image,
              accountId: String(currentUserAccountId),
            },
          });
        }
      }
    }
'''
          if old not in s:
              raise SystemExit('GiftPicker coin_transfer block not found')
          if 'const isLuckyGift = activeTab === "Lucky";' not in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- components/GiftPicker.tsx; then
            echo "No source patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/GiftPicker.tsx
          git commit -m "fix: Lucky gifts award 10 percent diamonds and animate on seat [lucky-gift-fix]"
          git push
